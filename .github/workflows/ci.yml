name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    # Prisma validates its datasource while Next.js collects route metadata.
    # CI never connects to this placeholder; database-backed pages are dynamic.
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/hello_the_world?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run type check
        run: npm run typecheck
      - name: Run build
        run: npm run build
